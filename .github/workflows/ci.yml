name: Acme Corp.

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.26

      - name: Run tests
        run: go test ./...

      - name: Notify on failure
        if: failure()
        run: echo "Tests failed! Please check the logs."

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Notify on failure
        if: failure()
        run: echo "Build failed! Please check the logs."

  staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Show staging info
        run: |
          echo "============================================="
          echo "Deployment to staging environment"
          echo "============================================="
          echo "Environment: staging"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Commit: ${{ github.sha}}"
          echo "Branch: ${{ github.ref_name}}"
          echo "Actor: ${{ github.actor}}"
          echo "Repository: ${{ github.repository}}"
          echo "Workflow: ${{ github.workflow}}"
          echo "Run ID: ${{ github.run_id}}"
          echo "============================================="

      - name: Run App
        run: |
          echo "Running the application in staging environment..."
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Notify on failure
        if: failure()
        run: echo "Deployment to staging failed! Please check the logs."

  deploy:
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Show deployment info
        run: |
          echo "============================================="
          echo "Deployment to production environment"
          echo "============================================="
          echo "Environment: production"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Commit: ${{ github.sha}}"
          echo "Branch: ${{ github.ref_name}}"
          echo "Actor: ${{ github.actor}}"
          echo "Repository: ${{ github.repository}}"
          echo "Workflow: ${{ github.workflow}}"
          echo "Run ID: ${{ github.run_id}}"
          echo "============================================="
      
      - name: Run App
        run: |
          echo "Running the application in production environment..."
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Notify on failure
        if: failure()
        run: echo "Deployment to production failed! Please check the logs."

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          # Add your cleanup commands here
          echo "Cleanup completed successfully."
