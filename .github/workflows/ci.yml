name: Acme Corp.

on:
    push:
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26

            - name: Run tests
              run: go test -v ./...

    build:
        runs-on: ubuntu-latest
        needs: test
        environment:
            name: staging
        steps:
            - name: Get code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26

            - name: Build
              run: go build -o myapp main.go

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: myapp
    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: production
        steps:
            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                  name: myapp

            - name: Deploy to production
              run: |
                  echo "Deploying to production..."
                  # Add your deployment commands here
                  echo "Deployment complete. Bye!"
