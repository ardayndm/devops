name: Acme Corp.

on:
    push:
        branches:
            - master
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4

            - name: Set up Golang
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26

            - name: Run tests
              run: go test ./...

            - name: Notify on failure
              if: failure()
              run: echo "Tests failed! Please check the logs."

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Get code
              uses: actions/checkout@v4

            - name: Set up Golang
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26

            - name: Build application
              run: go build -o myapp main.go

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: CorpApp
                  path: myapp

            - name: Notify on failure
              if: failure()
              run: echo "Build failed! Please check the logs."

    staging:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: staging
        steps:
            - name: Get artifact
              uses: actions/download-artifact@v4
              with:
                  name: CorpApp

            - name: Deploy to staging
              run: |
                  echo "Deploying to staging environment..."
                  # Add your deployment commands here
                  echo "Deployment to staging completed successfully."

            - name: Notify on failure
              if: failure()
              run: echo "Deployment to staging failed! Please check the logs."

    deploy:
        runs-on: ubuntu-latest
        needs: staging
        environment: production
        steps:
            - name: Get artifact
              uses: actions/download-artifact@v4
              with:
                  name: CorpApp

            - name: Deploy to production
              run: |
                  echo "Deploying to production environment..."
                  # Add your deployment commands here
                  echo "Deployment to production completed successfully."
                  chmod +x myapp
                  ./myapp

            - name: Notify on failure
              if: failure()
              run: echo "Deployment to production failed! Please check the logs."

            - name: Cleanup
              if: always()
              run: |
                  echo "Cleaning up temporary files..."
                  # Add your cleanup commands here
                  echo "Cleanup completed successfully."
